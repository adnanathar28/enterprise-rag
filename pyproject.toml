[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brd-knowledge"
version = "0.1.0"
description = "BRD document ingestion and normalized structure extraction service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "BRD Knowledge Team" }
]
dependencies = [
  "alembic>=1.13.0",
  "docling>=2.0.0",
  "fastapi>=0.115.0",
  "google-genai==2.22.0",
  "httpx>=0.28.1,<1.0.0",
  "pdfplumber>=0.11.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pgvector>=0.3.6,<1.0.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "torch>=2.2.0",
  "transformers>=4.48.0,<6.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires an external service such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["brd_knowledge"]

[[tool.mypy.overrides]]
module = [
  "docling.*",
  "fitz.*",
  "pdfplumber.*",
  "docx.*"
]
ignore_missing_imports = true

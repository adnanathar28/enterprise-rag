services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brd_knowledge_postgres
    environment:
      POSTGRES_USER: brd_knowledge
      POSTGRES_PASSWORD: brd_knowledge
      POSTGRES_DB: brd_knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brd_knowledge -d brd_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
